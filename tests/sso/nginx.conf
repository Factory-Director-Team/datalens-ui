events {}
http {
    access_log off;
    upstream bi { server ui:8080; server ui-second:8080; }
    server {
        listen 443 ssl;
        server_name app.sso.test untrusted.sso.test;
        ssl_certificate /fixtures/tls.crt;
        ssl_certificate_key /fixtures/tls.key;
        location / { proxy_pass http://host-backend:8080; proxy_set_header Host $host; }
    }
    server {
        listen 443 ssl;
        server_name bi.sso.test;
        ssl_certificate /fixtures/tls.crt;
        ssl_certificate_key /fixtures/tls.key;
        client_max_body_size 10m;
        location /api/internal/ { return 404; }
        location / {
            proxy_pass http://bi;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffer_size 32k;
            proxy_buffers 8 32k;
        }
    }
}
